# Four containers: ui (nginx: page + /api proxy) -> api (FastAPI: login, chats) -> agent (LangGraph) -> db (read-only SQL).
# Only ui is published, on this machine only. api has no LLM key and no internet; agent has the key but no users;
# db has neither and is reachable only by agent.
#   docker compose up --build                                          # http://127.0.0.1:8000
#   docker compose exec api python -m investigator add-user alice      # then log in as alice
services:
  ui:
    image: nginx:1.29-alpine
    ports: ["127.0.0.1:8000:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./investigator/static:/usr/share/nginx/html:ro
    depends_on: [api]
    networks: [edge, front]
  api:
    build: .
    command: ["python", "-m", "investigator", "serve", "--host", "0.0.0.0"]
    environment:
      AGENT_URL: http://agent:8002
      HISTORY_DB: /history/history.sqlite
    volumes: ["history:/history"]  # users, sessions and chats survive restarts and rebuilds
    depends_on: [agent]
    networks: [front, mid]
  agent:
    build: .
    command: ["python", "-m", "investigator", "agent", "--host", "0.0.0.0"]
    env_file: [{path: .env, required: false}]  # LLM_* only; without it saved chats still open and replay
    environment:
      DB_URL: http://db:8001
    depends_on: [db]
    networks: [mid, back, egress]
  db:
    build: .
    command: ["python", "-m", "investigator", "db", "--host", "0.0.0.0"]
    volumes: ["./data/investigation.sqlite:/app/data/investigation.sqlite:ro"]  # the only copy in the stack
    networks: [back]
networks:
  edge: {}                 # only for ui's published port (a port cannot be published on an internal network)
  front: {internal: true}  # ui <-> api
  mid: {internal: true}    # api <-> agent
  back: {internal: true}   # agent <-> db
  egress: {}               # the agent's way to the LLM API
volumes:
  history: {}
