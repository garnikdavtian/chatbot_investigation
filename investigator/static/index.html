<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Investigator</title>
<style>
/* Tokens. Neutral surfaces and one accent; text pairs meet WCAG AA (4.5:1) in both modes. */
:root {
  --bg: #f8fafc; --side: #f1f5f9; --panel: #fff; --sunken: #f8fafc; --text: #0f172a; --muted: #475569; --faint: #64748b;
  --border: #e2e8f0; --border-strong: #cbd5e1; --accent: #4f46e5; --accent-soft: #eef2ff; --on-accent: #fff;
  --user: #eef2ff; --hover: rgba(15, 23, 42, .05); --grid: #e9edf3; --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .06);
  --ok: #15803d; --ok-bg: #dcfce7; --warn: #a16207; --warn-bg: #fef9c3; --bad: #b91c1c; --bad-bg: #fee2e2; --idle: #475569; --idle-bg: #f1f5f9;
  --observed: #1d4ed8; --inferred: #7e22ce; --unknown: #475569;
  /* chart series: dataviz reference palette, validated for colour-vision separation against these surfaces */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, 0, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --side: #0b0d11; --panel: #171a21; --sunken: #12151b; --text: #e5e7eb; --muted: #9ca3af; --faint: #8b93a1;
    --border: #262b36; --border-strong: #353b48; --accent: #818cf8; --accent-soft: #1e2140; --on-accent: #0f1115;
    --user: #1e2235; --hover: rgba(255, 255, 255, .06); --grid: #232833; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .3);
    --ok: #4ade80; --ok-bg: #0d2818; --warn: #facc15; --warn-bg: #2a2308; --bad: #f87171; --bad-bg: #2d1316; --idle: #cbd5e1; --idle-bg: #1f2430;
    --observed: #93c5fd; --inferred: #d8b4fe; --unknown: #cbd5e1;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -100px; z-index: 40; background: var(--panel); padding: 8px 12px; border-radius: 8px; box-shadow: var(--shadow); }
.skip:focus { top: 8px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100vh; height: 100dvh; }

/* Sidebar */
aside { background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; gap: 10px; align-items: center; padding: 16px 16px 12px; }
.logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.brand strong { display: block; font-size: 15px; line-height: 1.2; }
.brand small { display: block; font-size: 12px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel);
  font-size: 14px; font-weight: 550; transition: background .15s var(--ease), border-color .15s var(--ease); }
.btn:hover:not(:disabled) { border-color: var(--border-strong); background: var(--sunken); }
.new { margin: 0 12px 16px; }
.label { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 16px 6px; margin: 0; letter-spacing: .02em; }
nav { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
nav button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; min-height: 44px; transition: background .15s var(--ease); }
nav button:hover { background: var(--hover); }
nav button[aria-current="true"] { background: var(--accent-soft); }
nav .q { display: block; font-size: 14px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav .meta { display: flex; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 2px; }
nav .meta .st { display: inline-flex; background: none; }
.empty-list { font-size: 13px; color: var(--muted); padding: 4px 10px; }
.mode { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); padding: 12px 16px; border-top: 1px solid var(--border); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.off { background: var(--faint); }

/* Conversation */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 8px; padding: 0 20px; border-bottom: 1px solid var(--border); min-height: 52px; }
.top h1 { font-size: 15px; font-weight: 600; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { display: none; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); flex: none; }
.scroll { flex: 1; overflow-y: auto; }
.thread { max-width: 768px; margin: 0 auto; padding: 28px 24px 40px; display: flex; flex-direction: column; gap: 28px; }
.user { align-self: flex-end; max-width: min(85%, 600px); background: var(--user); border-radius: 18px 18px 4px 18px; padding: 10px 16px; white-space: pre-wrap; overflow-wrap: anywhere; scroll-margin-top: 16px; }
.bot { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.bot-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.avatar { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.who { font-weight: 600; font-size: 14px; }
.meta-text { font-size: 13px; color: var(--muted); }
.answer { font-size: 17px; line-height: 1.65; margin: 0; max-width: 70ch; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 999px; white-space: nowrap; line-height: 1.5; }
.s-verified { color: var(--ok); background: var(--ok-bg); } .s-unverified { color: var(--warn); background: var(--warn-bg); }
.s-incomplete { color: var(--idle); background: var(--idle-bg); } .s-failed { color: var(--bad); background: var(--bad-bg); }
.banner { display: flex; gap: 10px; border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.banner ul { margin: 6px 0 0; padding-left: 18px; }
.banner p { margin: 0; }
h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
.findings { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.findings li { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: start; }
.kind { font-size: 12px; font-weight: 600; padding-top: 3px; }
.k-observed { color: var(--observed); } .k-inferred { color: var(--inferred); } .k-unknown { color: var(--unknown); }
.proof { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.proof .ok { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); }
.chip { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel);
  font: 500 12px var(--mono); color: var(--accent); vertical-align: middle; }
.chip:hover { border-color: var(--accent); }
.fail { color: var(--bad); font-size: 13px; }
.notes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 14px; color: var(--muted); }
.notes ul { margin: 0; padding-left: 18px; }
.notes li + li { margin-top: 4px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
.evidence > summary { display: flex; align-items: center; gap: 10px; padding: 12px 14px; list-style: none; min-height: 48px; font-size: 14px; border-radius: 14px; cursor: pointer; }
.evidence > summary::-webkit-details-marker { display: none; }
.evidence > summary:hover { background: var(--hover); }
.evidence > summary .chev { margin-left: auto; color: var(--muted); transition: transform .2s var(--ease); }
.evidence[open] > summary .chev { transform: rotate(180deg); }
.evidence[open] > summary { border-bottom: 1px solid var(--border); border-radius: 14px 14px 0 0; }
.evidence .body { padding: 14px; display: flex; flex-direction: column; gap: 18px; }
.ev-icon { color: var(--ok); display: grid; } .ev-icon.bad { color: var(--warn); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.scrollx { overflow-x: auto; }
.caption { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
details.query { border: 1px solid var(--border); border-radius: 10px; background: var(--sunken); }
details.query + details.query { margin-top: 8px; }
details.query > summary { padding: 10px 12px; font-size: 14px; min-height: 44px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
details.query[open] > summary { border-bottom: 1px solid var(--border); }
details.query .qbody { padding: 12px; overflow-x: auto; }
details.query.err > summary { color: var(--bad); }
.qid { font: 600 12px var(--mono); }
pre { font: 13px/1.5 var(--mono); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre-wrap; margin: 0 0 10px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: -6px; }
.ghost { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--muted);
  font-size: 13px; text-decoration: none; transition: background .15s var(--ease), color .15s var(--ease); }
.ghost:hover { background: var(--hover); color: var(--text); }
.actions [role="status"] { font-size: 13px; color: var(--muted); }

/* Chart */
.chart { padding: 16px; }
.chart-title { font-weight: 600; margin: 0; font-size: 15px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.legend i, .tip i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.plot { position: relative; margin-top: 10px; min-height: 240px; }
.plot svg { width: 100%; height: 240px; display: block; overflow: visible; }
.plot .grid { stroke: var(--grid); stroke-width: 1; }
.plot .axis { stroke: var(--border-strong); stroke-width: 1; }
.plot .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.plot .hl { fill: var(--hover); }
.plot .cross { stroke: var(--faint); stroke-width: 1; stroke-dasharray: 3 3; }
.plot .hit { fill: transparent; outline: none; }
.plot .hit:focus-visible { stroke: var(--accent); stroke-width: 2; }
.tip { position: absolute; z-index: 10; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13px; box-shadow: var(--shadow); white-space: nowrap; }
.tip b { font-variant-numeric: tabular-nums; margin-left: 12px; }
.tip div { display: flex; justify-content: space-between; align-items: center; }
.chart-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }

/* Progress while the model works */
.steps { list-style: none; margin: 0; padding: 0 0 0 4px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--muted); }
.steps li { display: flex; gap: 10px; align-items: center; }
.steps .done svg { color: var(--ok); } .steps .err { color: var(--bad); }
.steps .now { color: var(--text); }
.spinner { width: 15px; height: 15px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Empty conversation */
.thread.empty { min-height: 100%; justify-content: center; }
.hello { text-align: center; }
.hello .logo { width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 16px; }
.hello .logo svg.i { width: 24px; height: 24px; }
.hello h2 { font-size: 28px; line-height: 1.25; font-weight: 650; margin: 0 0 8px; text-wrap: balance; }
.hello p { color: var(--muted); margin: 0 auto; max-width: 56ch; }
.suggest { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 28px; text-align: left; }
.suggest button { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--panel);
  text-align: left; transition: border-color .15s var(--ease), box-shadow .15s var(--ease); }
.suggest button:hover:not(:disabled) { border-color: var(--border-strong); box-shadow: var(--shadow); }
.suggest .si { color: var(--accent); background: var(--accent-soft); border-radius: 8px; width: 32px; height: 32px; display: grid; place-items: center; flex: none; }
.suggest strong { display: block; font-size: 14px; }
.suggest span.d { display: block; font-size: 13px; color: var(--muted); line-height: 1.45; margin-top: 2px; }

/* Composer */
.composer { padding: 0 24px 16px; }
.composer form { max-width: 768px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--border-strong);
  border-radius: 20px; padding: 8px 8px 8px 18px; box-shadow: var(--shadow); transition: border-color .15s var(--ease); }
.composer form:focus-within { border-color: var(--accent); }
.composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: inherit; font: inherit; padding: 8px 0; max-height: 200px; line-height: 1.5; }
.composer textarea::placeholder { color: var(--faint); }
.send { display: grid; place-items: center; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); width: 40px; height: 40px; flex: none; }
.hint { max-width: 768px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--muted); }
.scrim { display: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } .spinner { animation-duration: 2.4s; } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(300px, 86vw); transform: translateX(-100%); transition: transform .22s var(--ease); }
  aside.open { transform: none; box-shadow: var(--shadow); }
  .scrim:not([hidden]) { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .35); }
  .icon-btn { display: grid; }
  .top { padding: 0 12px; }
  .thread { padding: 20px 16px 32px; }
  .composer { padding: 0 12px 12px; }
  .suggest, .notes { grid-template-columns: 1fr; }
  .findings li { grid-template-columns: 1fr; gap: 2px; }
}
</style>
</head>
<body>
<a class="skip" href="#q">Skip to the question box</a>
<div class="app">
  <aside id="side" aria-label="Chat history">
    <div class="brand"><span class="logo"><span data-icon="search"></span></span><div><strong>Data Investigator</strong><small>Answers with checked figures</small></div></div>
    <button class="btn new" id="new" type="button"><span data-icon="plus"></span>New chat</button>
    <h2 class="label">Recent</h2>
    <nav id="list"></nav>
    <div class="mode" id="mode"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main>
    <header class="top">
      <button class="icon-btn" id="menu" type="button" aria-label="Show chat history" aria-expanded="false" aria-controls="side"><span data-icon="menu"></span></button>
      <h1 id="title">New chat</h1>
    </header>
    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <div class="composer">
      <form id="composer">
        <label for="q" class="sr">Question</label>
        <textarea id="q" rows="1" maxlength="500" aria-describedby="limits"></textarea>
        <button class="send" type="submit" aria-label="Send question"><span data-icon="arrowUp"></span></button>
      </form>
      <p class="hint" id="limits"></p>
    </div>
  </main>
</div>
<script>

const SUGGESTIONS = [
  {icon: "trend", title: "Explain a change", text: "Why did net sales change between August and September 2026?"},
  {icon: "users", title: "Find what drove it", text: "Which customer segment drove the change in refunds from August to September 2026?"},
  {icon: "lineChart", title: "Visualize by month", text: "Visualize gross sales, refunds and net sales by month"},
  {icon: "barChart", title: "Compare segments", text: "Plot September 2026 net sales by customer segment"}];
const STATUS = {
  verified: {label: "Verified", icon: "circleCheck", note: "Every figure is in its query's result and equals the business rules."},

  incomplete: {label: "Incomplete", icon: "pause", note: "A limit stopped the model before it finished. What it found so far is shown below."},
  failed: {label: "Failed", icon: "circleX", note: "This run failed. Any queries that ran are shown below."}};

const METRICS = ["gross", "refunds", "net"];
const $ = id => document.getElementById(id);
// thread = {root, runs: [full run records]}. nav changes on every navigation, so a late reply cannot draw into another view.
let config = {}, runs = [], thread = null, pending = null, notice = null, nav = 0;

// Text only: model output never becomes HTML.

function icon(name, cls = "") {

function render() {
  const view = $("thread"), items = [];
  for (const r of thread?.runs || []) items.push(h("div", {class: "user", id: `ask-${r.run_id}`}, r.question), botMsg(r));
  if (pending?.nav === nav) items.push(h("div", {class: "user"}, pending.question),
    h("article", {class: "bot", id: "pending", "aria-busy": "true", "aria-live": "polite"}, pendingView()));
  if (notice?.nav === nav) items.push(...(notice.question ? [h("div", {class: "user"}, notice.question)] : []),
    h("div", {class: "banner s-failed", role: "alert"}, icon("circleX"), h("div", {}, h("p", {}, notice.error),
      notice.question && config.live ? h("button", {type: "button", class: "btn", style: "margin-top:8px", onclick: () => ask(notice.question)},
        icon("replay", "sm"), "Try again") : null)));
  view.classList.toggle("empty", !items.length);
  view.replaceChildren(...(items.length ? items : [emptyView()]));
  $("title").textContent = thread ? thread.runs[0].question : pending?.nav === nav ? pending.question : "New chat";
  document.title = thread ? `${thread.runs[0].question} · Data Investigator` : "Data Investigator";
  $("q").placeholder = !config.live ? "No API key: saved chats only" : thread ? "Ask a follow-up…" : "Ask why sales changed, or ask for a chart…";
  $("q").disabled = $("composer").querySelector("button").disabled = !config.live || !!pending;
  renderList();
}
const toBottom = () => { const sc = $("scroll"); sc.scrollTop = sc.scrollHeight; };
const toRun = id => $(`ask-${id}`)?.scrollIntoView({block: "start"});

function setDrawer(open) {
  $("side").classList.toggle("open", open);
  $("scrim").hidden = !open;
  $("menu").setAttribute("aria-expanded", String(open));
}
function go(id) {
  setDrawer(false);
  if (location.hash.slice(1) === id) route(); else location.hash = id;
}
async function route() {
  const id = location.hash.slice(1);
  notice = null;
  if (!id) { nav++; thread = null; render(); $("q").focus(); return; }
  const root = rootOf(id), token = ++nav;
  const ids = runs.filter(r => rootOf(r.run_id) === root).sort((a, b) => a.created_at.localeCompare(b.created_at)).map(r => r.run_id);
  try {
    const full = await Promise.all((ids.length ? ids : [id]).map(i => api(`/api/runs/${i}`)));
    if (token !== nav) return;
    thread = {root, runs: full};
  } catch (e) {
    if (token !== nav) return;
    thread = null; notice = {nav, question: "", error: `Could not open this chat: ${e.message}`};
  }
  render();
  toRun(id === root ? thread?.runs.at(-1).run_id : id);
}

async function ask(question) {
  if (pending || !config.live) return;
  const parent = thread ? thread.runs.at(-1).run_id : null, token = nav;
  notice = null; pending = {question, t0: Date.now(), nav, progress: null};
  $("q").value = ""; grow(); render(); toBottom();
  let run = null;
  try {
    run = await askStream({question, parent_run_id: parent}, progress => {
      pending.progress = progress;
      const el = $("pending");
      if (el && token === nav) { el.replaceChildren(...pendingView()); toBottom(); }
    });
    runs = await api("/api/runs");
  } catch (e) {
    if (token === nav) notice = {nav, question, error: e.message};
  }
  pending = null;
  if (run && token === nav) {
    if (!thread) { thread = {root: run.run_id, runs: []}; history.replaceState(null, "", `#${run.run_id}`); }
    thread.runs.push(run);
  }
  render();
  if (token !== nav) return;
  if (run) toRun(run.run_id);
  else { toBottom(); $("q").value = question; grow(); }
}

function grow() { const q = $("q"); q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 200) + "px"; }

async function init() {
  document.querySelectorAll("[data-icon]").forEach(el => el.replaceWith(icon(el.dataset.icon)));
  config = await api("/api/config");
  $("mode").replaceChildren(h("span", {class: "dot" + (config.live ? "" : " off"), "aria-hidden": "true"}),
    config.live ? `Live · ${config.model}` : "No API key · saved runs and replay");
  $("limits").textContent = config.live ? "Figures are checked against the data. Explanations of why can still be wrong."
    : "Set LLM_API_KEY in .env to ask new questions.";
  $("composer").addEventListener("submit", e => { e.preventDefault(); const q = $("q").value.trim(); if (q) ask(q); });
  $("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });
  $("q").addEventListener("input", grow);
  $("new").addEventListener("click", () => { setDrawer(false); if (location.hash) history.pushState(null, "", location.pathname); route(); });
  $("menu").addEventListener("click", () => setDrawer(!$("side").classList.contains("open")));
  $("scrim").addEventListener("click", () => setDrawer(false));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && $("side").classList.contains("open")) { setDrawer(false); $("menu").focus(); } });
  runs = await api("/api/runs");
  await route();
}
window.addEventListener("popstate", route);  // back/forward, including hash changes
init().catch(e => { notice = {nav, question: "", error: e.message}; render(); });
</script>
</body>
</html>
