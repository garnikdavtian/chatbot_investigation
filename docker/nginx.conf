# The ui container: serves the page and its script, and proxies /api/ to the app container.
server {
    listen 80;
    root /usr/share/nginx/html;
    # Same headers as investigator/web.py (tests/test_web.py checks the CSP matches).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    location = / { try_files /index.html =404; }
    location = /app.js { }
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;  # the app's Host check sees 127.0.0.1:8000
        proxy_buffering off;               # stream the NDJSON progress as it comes
        proxy_read_timeout 300s;           # an investigation can take a minute or two
    }
    location / { return 404; }
}
